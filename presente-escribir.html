<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escribe la forma correcta – Present tense typing practice</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6e9;--ink:#14205a;--card:#fff;--line:#14205a;--accent:#e4572e;--sun:#f2b632;--muted:#4c5788;--chip:#e9efff;--good:#2f8f4e;--bad:#c53b3b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1533;--ink:#f6f1e0;--card:#18224d;--line:#f6f1e0;--accent:#ff8a63;--sun:#f2b632;--muted:#aab4e6;--chip:#243069;--good:#5fd487;--bad:#ff8080}}
:root[data-theme="dark"]{--bg:#0e1533;--ink:#f6f1e0;--card:#18224d;--line:#f6f1e0;--accent:#ff8a63;--sun:#f2b632;--muted:#aab4e6;--chip:#243069;--good:#5fd487;--bad:#ff8080}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:clamp(12px,2.5vw,32px);display:flex;flex-direction:column;gap:clamp(14px,2.5vw,26px)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:clamp(1.5rem,4.2vw,2.9rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.score{font-weight:800;font-size:clamp(1rem,2vw,1.4rem);background:var(--chip);border-radius:999px;padding:.4em 1em}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:inherit;font-weight:700;font-size:clamp(.9rem,1.8vw,1.2rem);padding:.35em 1em;border:3px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,36px);box-shadow:8px 8px 0 var(--sun);display:flex;flex-direction:column;gap:clamp(12px,2vw,20px)}
.meta{display:flex;flex-wrap:wrap;gap:10px;font-weight:700;font-size:clamp(.9rem,1.6vw,1.15rem);color:var(--muted)}
.meta b{color:var(--ink)}
.sentence{font-size:clamp(1.3rem,3.4vw,2.3rem);font-weight:800;line-height:1.35}
.blankwrap{display:inline-flex;align-items:baseline;gap:.3em}
#blank{font:inherit;font-weight:800;font-size:1em;width:clamp(6em,26vw,10em);border:none;border-bottom:4px solid var(--line);background:transparent;color:var(--accent);padding:.05em .1em;text-align:center}
#blank:focus{outline:none;border-color:var(--accent)}
#blank.correct{color:var(--good);border-color:var(--good)}
#blank.wrong{color:var(--bad);border-color:var(--bad)}
.inf{font-weight:500;color:var(--muted);font-size:.55em}
.feedback{min-height:1.6em;font-weight:800;font-size:clamp(1rem,2.2vw,1.4rem)}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
.accents{display:flex;flex-wrap:wrap;gap:8px}
.accents button{font:inherit;font-weight:800;font-size:clamp(1rem,2vw,1.3rem);width:2.4em;height:2.4em;border-radius:12px;border:3px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.actions button{font:inherit;font-weight:800;font-size:clamp(1rem,2vw,1.4rem);padding:.6em 1.3em;border-radius:16px;border:3px solid var(--line);cursor:pointer;background:var(--card);color:var(--ink)}
.actions .go{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,#blank:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.tip{margin:0;color:var(--muted);font-size:clamp(.85rem,1.5vw,1.05rem)}
[hidden]{display:none!important}
@media (max-width:600px){.sentence{font-size:clamp(1.15rem,5vw,1.7rem)}#blank{width:clamp(5em,40vw,9em)}}
</style>
</head>
<body>
<main>
<header>
  <h1>Escribe la forma correcta</h1>
  <div class="score" id="score">0 / 0</div>
</header>

<div class="chips" role="group" aria-label="Verb type">
  <button class="chip" data-c="all" aria-pressed="true">Todos</button>
  <button class="chip" data-c="reg" aria-pressed="false">Regulares</button>
  <button class="chip" data-c="stem" aria-pressed="false">Cambio de raíz</button>
  <button class="chip" data-c="yo" aria-pressed="false">Irregulares en yo</button>
  <button class="chip" data-c="big" aria-pressed="false">ser · estar · ir</button>
</div>

<div class="card">
  <div class="meta">Verbo: <b id="infShown"></b> <span id="typeShown"></span></div>
  <div class="sentence" id="sentence"></div>
  <div class="accents" id="accents" role="group" aria-label="Insert accent"></div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="actions">
  <button class="go" id="check">Revisar (Enter)</button>
  <button id="next">Siguiente (Space)</button>
  <button id="reveal">Mostrar respuesta</button>
</div>
<p class="tip">Accents count — <b>hablo</b> and <b>habló</b> are different answers here. Tap a letter below to insert it, or use your keyboard's accent keys. Press Enter to check, Space for a new sentence.</p>
</main>

<script>
const $=id=>document.getElementById(id), pick=a=>a[Math.floor(Math.random()*a.length)];
const R=(i,e)=>({i,e,c:"reg"});
const S=(i,e,a,b)=>({i,e,c:"stem",s:[a,b]});
const Y=(i,e,y,x)=>({i,e,c:"yo",o:{0:y},...x});
const B=(i,e,f)=>({i,e,c:"big",f});
const V=[R("hablar","to speak"),R("caminar","to walk"),R("estudiar","to study"),R("bailar","to dance"),R("trabajar","to work"),R("comer","to eat"),R("beber","to drink"),R("correr","to run"),R("leer","to read"),R("aprender","to learn"),R("vivir","to live"),R("escribir","to write"),R("abrir","to open"),R("compartir","to share"),
S("pensar","to think","e","ie"),S("querer","to want","e","ie"),S("empezar","to begin","e","ie"),S("preferir","to prefer","e","ie"),S("entender","to understand","e","ie"),S("poder","to be able to","o","ue"),S("dormir","to sleep","o","ue"),S("volver","to return","o","ue"),S("almorzar","to eat lunch","o","ue"),S("encontrar","to find","o","ue"),S("jugar","to play","u","ue"),S("pedir","to ask for","e","i"),S("servir","to serve","e","i"),S("repetir","to repeat","e","i"),
Y("hacer","to do / make","hago"),Y("poner","to put","pongo"),Y("salir","to leave","salgo"),Y("traer","to bring","traigo"),Y("conocer","to know (a person)","conozco"),Y("saber","to know (a fact)","sé"),Y("dar","to give","doy",{o:{0:"doy",4:"dais"}}),Y("ver","to see","veo",{o:{0:"veo",4:"veis"}}),
Y("tener","to have","tengo",{s:["e","ie"]}),Y("venir","to come","vengo",{s:["e","ie"]}),Y("decir","to say","digo",{s:["e","i"]}),
B("ser","to be",["soy","eres","es","somos","sois","son"]),
B("estar","to be",["estoy","estás","está","estamos","estáis","están"]),
B("ir","to go",["voy","vas","va","vamos","vais","van"])];
const CL={reg:"Regular",stem:"Cambio de raíz",yo:"Irregular en yo",big:"Verbo especial"};
const SUBJ=[["yo",0],["tú",1],["él",2],["ella",2],["usted",2],["mi mamá",2],["el profesor",2],["nosotros",3],["nosotras",3],["mis amigos y yo",3],["ellos",5],["ellas",5],["ustedes",5],["mis padres",5],["los estudiantes",5],["Ana y Luis",5]];
const TAIL={
 "hablar":s=>`${s} ____ español en clase.`, "caminar":s=>`${s} ____ al parque los sábados.`, "estudiar":s=>`${s} ____ para el examen.`, "bailar":s=>`${s} ____ salsa en la fiesta.`, "trabajar":s=>`${s} ____ los fines de semana.`,
 "comer":s=>`${s} ____ frutas todos los días.`, "beber":s=>`${s} ____ mucha agua.`, "correr":s=>`${s} ____ por la mañana.`, "leer":s=>`${s} ____ un libro nuevo.`, "aprender":s=>`${s} ____ español rápido.`,
 "vivir":s=>`${s} ____ cerca de la escuela.`, "escribir":s=>`${s} ____ una carta.`, "abrir":s=>`${s} ____ la puerta.`, "compartir":s=>`${s} ____ sus ideas en clase.`,
 "pensar":s=>`${s} ____ mucho antes de decidir.`, "querer":s=>`${s} ____ viajar a España.`, "empezar":s=>`${s} ____ la tarea a las cinco.`, "preferir":s=>`${s} ____ el té al café.`, "entender":s=>`${s} ____ la lección.`,
 "poder":s=>`${s} ____ ayudar hoy.`, "dormir":s=>`${s} ____ ocho horas.`, "volver":s=>`${s} ____ a casa tarde.`, "almorzar":s=>`${s} ____ a las doce.`, "encontrar":s=>`${s} ____ las llaves.`,
 "jugar":s=>`${s} ____ fútbol los viernes.`, "pedir":s=>`${s} ____ ayuda cuando la necesita.`, "servir":s=>`${s} ____ la cena.`, "repetir":s=>`${s} ____ la pregunta.`,
 "hacer":s=>`${s} ____ la tarea después de clase.`, "poner":s=>`${s} ____ la mesa.`, "salir":s=>`${s} ____ con amigos los viernes.`, "traer":s=>`${s} ____ la comida a la fiesta.`,
 "conocer":s=>`${s} ____ a mucha gente.`, "saber":s=>`${s} ____ la respuesta.`, "dar":s=>`${s} ____ un regalo.`, "ver":s=>`${s} ____ una película.`,
 "tener":s=>`${s} ____ mucha tarea hoy.`, "venir":s=>`${s} ____ a la escuela en autobús.`, "decir":s=>`${s} siempre ____ la verdad.`,
 "ser":s=>`${s} ____ muy simpático/a.`, "estar":s=>`${s} ____ en la biblioteca ahora.`, "ir":s=>`${s} ____ al cine los sábados.`
};
const END={ar:["o","as","a","amos","áis","an"],er:["o","es","e","emos","éis","en"],ir:["o","es","e","imos","ís","en"]};
function form(v,i){if(v.f)return v.f[i]; if(v.o&&v.o[i])return v.o[i];
  let x=v.i.slice(0,-2);
  if(v.s&&i!==3&&i!==4){const k=x.lastIndexOf(v.s[0]);x=x.slice(0,k)+v.s[1]+x.slice(k+v.s[0].length)}
  return x+END[v.i.slice(-2)][i]}
function strip(t){return t.toLowerCase().trim()}
const ACC=["á","é","í","ó","ú","ñ","ü"];
function buildAccents(){
  $("accents").innerHTML=ACC.map(c=>`<button type="button" data-c="${c}">${c}</button>`).join("");
  $("accents").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const box=$("blank"); if(!box||box.disabled)return;
    const start=box.selectionStart??box.value.length, end=box.selectionEnd??box.value.length;
    box.value=box.value.slice(0,start)+b.dataset.c+box.value.slice(end);
    box.focus(); box.setSelectionRange(start+1,start+1);
  });
}

let cat="all",correct=0,total=0,s={},checked=false;
const list=()=>cat==="all"?V:V.filter(v=>v.c===cat);
function deal(){
  const l=list(); s.v=pick(l);
  const sub=pick(SUBJ); s.subjTxt=sub[0]; s.p=sub[1];
  s.ans=form(s.v,s.p);
  const tail=TAIL[s.v.i](sub[0]);
  s.pre=tail.split("____")[0]; s.post=tail.split("____")[1];
  render();
}
function render(){
  $("infShown").textContent=s.v.i; $("typeShown").textContent="· "+CL[s.v.c]+" · "+s.v.e;
  $("sentence").innerHTML=`${s.pre}<span class="blankwrap"><input id="blank" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="type the conjugated verb"></span>${s.post}`;
  $("feedback").className="feedback"; $("feedback").textContent="";
  checked=false;
  $("blank").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check()}});
  $("blank").focus();
}
function check(){
  const box=$("blank"); const val=box.value;
  if(!val.trim())return;
  if(checked){deal();return}
  checked=true; total++;
  const ok=strip(val)===strip(s.ans);
  if(ok){correct++;box.classList.add("correct");$("feedback").className="feedback good";$("feedback").textContent="¡Correcto! ✔";}
  else{box.classList.add("wrong");$("feedback").className="feedback bad";$("feedback").textContent=`Casi — la forma correcta es "${s.ans}".`;}
  $("score").textContent=`${correct} / ${total}`;
  box.disabled=true;
}
function reveal(){const box=$("blank");box.value=s.ans;box.classList.remove("wrong");box.classList.add("correct");$("feedback").className="feedback good";$("feedback").textContent=`Respuesta: "${s.ans}"`;box.disabled=true;checked=true;}
document.querySelectorAll(".chip[data-c]").forEach(b=>b.onclick=()=>{cat=b.dataset.c;document.querySelectorAll(".chip[data-c]").forEach(x=>x.setAttribute("aria-pressed",x===b));deal()});
$("check").onclick=check; $("next").onclick=deal; $("reveal").onclick=reveal;
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.id!=="blank"){e.preventDefault();deal()}});
buildAccents();
deal();
</script>
</body>
</html>
